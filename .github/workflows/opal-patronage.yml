name: Refresh TfNSW station patronage

on:
  schedule:
    # TfNSW's Opal station-month dataset updates infrequently. Do not query the
    # authenticated CKAN DataStore every five minutes with the live train feed.
    - cron: '35 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opal-station-patronage
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check TfNSW CKAN access configuration
        id: credentials
        env:
          TFNSW_CKAN_TOKEN: ${{ secrets.TFNSW_CKAN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TFNSW_CKAN_TOKEN}" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Recent station patronage cannot refresh: TFNSW_CKAN_TOKEN is not configured."
            {
              echo '### Recent station patronage not connected'
              echo 'Add repository Actions secret TFNSW_CKAN_TOKEN to enable authenticated TfNSW monthly data.'
              echo 'Historical Opal station usage remains available. No recent monthly values were imported.'
            } >> "$GITHUB_STEP_SUMMARY"
            # A manual run is a deliberate request to import the latest data;
            # never report manual success when we have no API credential.
            if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then exit 1; fi
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: 22
      - name: Check out published data branch
        if: steps.credentials.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch data --single-branch "$remote" data
      - name: Refresh CKAN monthly station entries and exits
        if: steps.credentials.outputs.configured == 'true'
        env:
          TFNSW_CKAN_TOKEN: ${{ secrets.TFNSW_CKAN_TOKEN }}
          DATA_DIR: data
        run: node scripts/refresh-ckan-patronage.mjs
      - name: Commit validated updated monthly snapshot only
        if: steps.credentials.outputs.configured == 'true'
        working-directory: data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -d patronage || exit 0
          git add patronage/monthly.csv patronage/provenance.json || true
          if git diff --cached --quiet; then
            echo "No new monthly station data to publish."
            exit 0
          fi
          git commit -m "Refresh TfNSW Opal station-month usage"
          for attempt in 1 2 3; do
            git push origin HEAD:data && exit 0
            git fetch --quiet --depth 1 origin data
            git rebase FETCH_HEAD || exit 1
            sleep 5
          done
          echo "::error::Could not update data branch station patronage"
          exit 1
