name: Collect and publish

on:
  schedule:
    # Every 5 minutes. GitHub runs scheduled jobs on a best-effort basis, so gaps of 10-15 minutes are normal.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data --single-branch "$remote" data
          else
            mkdir data && git -C data init -q -b data && git -C data remote add origin "$remote"
          fi

      - name: Restore timetable lookups
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: gtfs-none
          restore-keys: gtfs-

      - name: Collect alerts and delays
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          DATA_DIR: data
          CACHE_DIR: .cache
        run: |
          if [ -z "$TFNSW_API_KEY" ]; then
            echo "::error::The TFNSW_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node src/collect.js

      - name: Save timetable lookups
        if: always() && hashFiles('.cache/gtfs/*.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache
          key: gtfs-${{ hashFiles('.cache/gtfs/*.json') }}

      - name: Commit collected data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -q -m "Data collected $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git push -q origin HEAD:data && exit 0
            git fetch -q --depth 1 origin data && git rebase -q FETCH_HEAD || true
            sleep 5
          done
          echo "::error::Could not push to the data branch"
          exit 1

      - name: Build the site
        env:
          DATA_DIR: data
          OUT_DIR: dist
        run: node src/build.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
