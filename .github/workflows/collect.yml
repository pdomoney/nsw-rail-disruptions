name: Collect and publish

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour when GitHub's scheduler is busiest.
    # GitHub runs scheduled jobs on a best-effort basis, so gaps of 10-15 minutes are normal.
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data --single-branch "$remote" data
          else
            mkdir data && git -C data init -q -b data && git -C data remote add origin "$remote"
          fi

      - name: Restore timetable lookups
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: gtfs-none
          restore-keys: gtfs-

      - name: Collect alerts and delays
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
          DATA_DIR: data
          CACHE_DIR: .cache
        run: |
          if [ -z "$TFNSW_API_KEY" ]; then
            echo "::error::The TFNSW_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          node src/collect.js

      - name: Save timetable lookups
        # Only when the lookups changed (cache keys can't be overwritten).
        if: always() && hashFiles('.cache/gtfs/*.json') != '' && steps.restore.outputs.cache-matched-key != format('gtfs-{0}', hashFiles('.cache/gtfs/*.json'))
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache
          key: gtfs-${{ hashFiles('.cache/gtfs/*.json') }}

      - name: Commit collected data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -q -m "Data collected $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git push -q origin HEAD:data && exit 0
            git fetch -q --depth 1 origin data && git rebase -q FETCH_HEAD || true
            sleep 5
          done
          echo "::error::Could not push to the data branch"
          exit 1

      - name: Build the site
        env:
          DATA_DIR: data
          OUT_DIR: dist
        run: node src/build.js

      # The checksum-pinned official PDF is a 30 October 2026 background, unlike the live data
      # collected every five minutes. Keep the approved raster cached between runs.
      - name: Restore the official TfNSW map background
        id: official-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/official-tfnsw-map-2026.png
          key: tfnsw-map-2026-v1

      # The PR test workflow installs Poppler, but production previously did not.
      # Every green Pages deployment therefore omitted the original map image.
      # Install only on a cache miss; later five-minute builds reuse the validated PNG.
      - name: Install PDF renderer on first official-map publish
        if: steps.official-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -y -qq install poppler-utils
          fi
          command -v pdftoppm
          command -v pdftotext
          command -v pdfinfo

      - name: Publish and verify the original TfNSW map image
        run: |
          set -euo pipefail
          mkdir -p dist/assets .cache
          if test -s .cache/official-tfnsw-map-2026.png; then
            OFFICIAL_MAP_PNG_INPUT=".cache/official-tfnsw-map-2026.png" \
              bash scripts/render-official-map.sh dist/assets
          else
            OFFICIAL_MAP_PNG_INPUT="" bash scripts/render-official-map.sh dist/assets
            cp dist/assets/tfnsw-sydney-rail-2026.png .cache/official-tfnsw-map-2026.png
          fi
          node scripts/verify-official-map.mjs dist/assets/tfnsw-sydney-rail-2026.png
          echo "TfNSW original-map PNG verified and included in Pages deployment."

      - name: Cache the approved official map image
        if: steps.official-cache.outputs.cache-hit != 'true' && hashFiles('.cache/official-tfnsw-map-2026.png') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/official-tfnsw-map-2026.png
          key: tfnsw-map-2026-v1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
        # GitHub occasionally can't find the artifact uploaded a moment earlier; wait and try once more.
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # Fallback for GitHub's scheduler, which is best-effort and on this repository has not fired at all.
  # While no scheduled run has happened in the last 30 minutes, each run starts the next one about
  # five minutes after it began. It stops by itself once scheduled runs are arriving.
  # To switch it off, add a repository variable SELF_SCHEDULE with the value "off".
  next:
    needs: collect
    if: always() && vars.SELF_SCHEDULE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Start the next run unless one is already waiting
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          started=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          wait=$(( 290 - ( $(date +%s) - $(date -d "$started" +%s) ) ))
          if [ "$wait" -gt 0 ]; then
            echo "Waiting ${wait}s before starting the next run."
            sleep "$wait"
          fi
          # A scheduled or manual run queued meanwhile carries on the chain (it waits for this one to finish).
          waiting=$(gh run list --workflow collect.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$waiting" -gt 0 ]; then
            echo "Another run is already queued, so it will start next."
            exit 0
          fi
          for attempt in 1 2 3; do
            gh workflow run collect.yml --ref "${DEFAULT_BRANCH:-main}" && exit 0
            sleep 15
          done
          echo "::warning::Could not start the next run. Collection resumes on the next scheduled run or push."
