name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'site/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verify and render published TfNSW PDF background
        run: |
          if ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -y -qq install poppler-utils
          fi
          OFFICIAL_MAP_SOURCE_AUDIT=1 OFFICIAL_MAP_PNG_INPUT="" bash scripts/render-official-map.sh test-artifacts/assets
          node scripts/verify-official-map.mjs test-artifacts/assets/tfnsw-sydney-rail-2026.png
      - name: Inspect real 2026 TfNSW PDF station circles and source anchor displacement
        run: |
          python3 -m pip -q install pymupdf
          python3 scripts/audit-2026-vector-stations.py \
            --pdf test-artifacts/assets/tfnsw-sydney-rail-2026.pdf \
            --source site/official-2026-alignment.js \
            --out-dir test-artifacts/vector-review
          cat test-artifacts/vector-review/station-vector-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save source station-symbol evidence for operator verification
        uses: actions/upload-artifact@v4
        with:
          name: tfnsw-2026-vector-station-audit
          path: test-artifacts/vector-review/
          retention-days: 21
      - name: Upload approved 2026 map rendition for source review
        uses: actions/upload-artifact@v4
        with:
          name: official-tfnsw-map-background
          path: test-artifacts/assets/tfnsw-sydney-rail-2026.png
          retention-days: 21
      # Historical 2024 overlay calibration is intentionally NOT run against
      # the reorganised 2026 PDF: it would produce false station coordinates.
      - name: Render network layout review previews
        run: node scripts/preview-network.js
      - name: Attach network diagram previews
        uses: actions/upload-artifact@v4
        with:
          name: sydney-network-diagram-layout
          path: test-artifacts/network-schematic-*.svg
          retention-days: 21
