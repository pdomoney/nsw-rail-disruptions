name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'site/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Render network layout review previews
        run: node scripts/preview-network.js
      - name: Attach network diagram previews
        uses: actions/upload-artifact@v4
        with:
          name: sydney-network-diagram-layout
          path: test-artifacts/network-schematic-*.svg
          retention-days: 21
